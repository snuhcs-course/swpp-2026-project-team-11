name: Decision-tree engine tests

on:
  pull_request:
    branches: [main, "feat/i*-*"]
    paths: ["backend/**", "pyproject.toml", "uv.lock", ".github/workflows/decision-tree-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install dependencies
        run: python -m pip install uv
      - name: Validate DB and question-engine integration
        run: uv run --isolated --locked python -m pytest backend/menus backend/question_engines/decision_tree backend/question_engines/rl backend/question_engines/benchmark backend/recommend backend/accounts -v
