name: Decision-tree engine tests

on:
  pull_request:
    branches: [MVP]
    paths: ["backend/**", ".github/workflows/decision-tree-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate DB and question-engine integration
        run: python backend/manage.py test menus question_engines.decision_tree recommend --verbosity 2
