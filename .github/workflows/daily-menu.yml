# AI-generated: written with Claude (Anthropic) and reviewed by the team.
name: Daily menu pipeline

# Fetches, preprocesses and tags the day's SNU cafeteria menu into the team's
# shared Supabase database. Setup: backend/README.md, "Daily automation".
#
# GitHub only runs scheduled and manual ("Run workflow") triggers for workflow
# files on the repository's default branch, so this runs once it is there.
on:
  schedule:
    - cron: "0 22 * * *"  # 22:00 UTC = 07:00 KST, before breakfast menus are needed
  workflow_dispatch:
    inputs:
      date:
        description: "Menu date as YYYY-MM-DD (empty: today in Seoul)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-menu-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # The menu model, "<provider>:<model>" (backend/menus/llm.py); empty: Gemini.
      METCHU_MENU_MODEL: ${{ vars.METCHU_MENU_MODEL }}
      MENU_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pipeline code lives on the integration branch. Set the repository
          # variable MENU_PIPELINE_REF to run it from another branch.
          ref: ${{ vars.MENU_PIPELINE_REF || 'MVP' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check the secrets
        run: |
          key=$(cd backend && python -c "from menus import llm; print(llm.key_name())")
          if [ -z "$DATABASE_URL" ] || [ -z "${!key}" ]; then
            echo "::error::Add the DATABASE_URL and $key repository secrets (backend/README.md, Daily automation)."
            exit 1
          fi
      - name: Apply database migrations
        run: python backend/manage.py migrate --noinput
      - name: Fetch, preprocess and tag the menu
        run: |
          if [ -n "$MENU_DATE" ]; then
            python backend/manage.py run_daily_pipeline --date "$MENU_DATE" --review review.csv
          else
            python backend/manage.py run_daily_pipeline --review review.csv
          fi
      - name: Keep the review CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-review-${{ github.run_id }}
          path: review.csv
          if-no-files-found: ignore
          retention-days: 14
