# AI-generated: written with Claude (Anthropic) and reviewed by the team.
name: Legacy menu pipeline (manual recovery)

# Manual recovery for the former Supabase deployment. The live catalogue is
# written by Metchu-DailyMenus on the mini PC; see docs/mini-pc-host.md.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Menu date as YYYY-MM-DD (empty: today in Seoul)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-menu-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # The menu model, "<provider>:<model>" (backend/menus/llm.py); empty: Gemini.
      METCHU_MENU_MODEL: ${{ vars.METCHU_MENU_MODEL }}
      MENU_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The pipeline code lives on the integration branch. Set the repository
          # variable MENU_PIPELINE_REF to run it from another branch.
          ref: ${{ vars.MENU_PIPELINE_REF || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check the secrets
        run: |
          key=$(cd backend && python -c "from menus import llm; print(llm.key_name())")
          if [ -z "$DATABASE_URL" ] || [ -z "${!key}" ]; then
            echo "::error::Add the DATABASE_URL and $key repository secrets (backend/README.md, Daily automation)."
            exit 1
          fi
      - name: Apply database migrations
        run: python backend/manage.py migrate --noinput
      - name: Fetch, preprocess and tag the menu
        run: |
          if [ -n "$MENU_DATE" ]; then
            python backend/manage.py run_daily_pipeline --date "$MENU_DATE" --review review.csv
          else
            python backend/manage.py run_daily_pipeline --review review.csv
          fi
      - name: Keep the review CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-review-${{ github.run_id }}
          path: review.csv
          if-no-files-found: ignore
          retention-days: 14
