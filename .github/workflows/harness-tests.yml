name: Project harness tests

on:
  pull_request:
    branches: [MVP, "feat/i*-*"]
    paths: ["tools/**", ".gitignore", ".github/workflows/harness-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest==9.*"
      - run: python -m pytest tools/tests
