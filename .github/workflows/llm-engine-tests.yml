name: LLM engine tests

on:
  pull_request:
    branches: [main, "feat/i*-*"]
    paths: ["backend/**", "pyproject.toml", "uv.lock", ".github/workflows/llm-engine-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install dependencies
        run: python -m pip install uv
      - name: Test the LLM engine with a fake LLM (no API key)
        run: uv run --isolated --locked python -m pytest backend/question_engines/llm -v
